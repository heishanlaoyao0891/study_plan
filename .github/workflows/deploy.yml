name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "SERVER_HOST and SERVER_SSH_KEY secrets are required."
            exit 1
          fi
          SERVER_PORT="${SERVER_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Sync repository to server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SERVER_PORT="${SERVER_PORT:-22}"
          SERVER_USER="${SERVER_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/study-plan}"
          SSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          $SSH "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude '.env' \
            --exclude '.env.production' \
            --exclude 'backend/*.db' \
            --exclude 'backend/*.db-*' \
            -e "$SSH" ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"

      - name: Write production env
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          SERVER_PORT="${SERVER_PORT:-22}"
          SERVER_USER="${SERVER_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/study-plan}"
          SSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          if [ -n "$PRODUCTION_ENV" ]; then
            printf '%s\n' "$PRODUCTION_ENV" | $SSH "$SERVER_USER@$SERVER_HOST" "cat > '$DEPLOY_PATH/.env.production'"
          fi
          $SSH "$SERVER_USER@$SERVER_HOST" "test -s '$DEPLOY_PATH/.env.production' || (echo 'Missing $DEPLOY_PATH/.env.production. Set PRODUCTION_ENV secret or create it on the server.' && exit 1)"

      - name: Deploy with Docker Compose
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          SERVER_PORT="${SERVER_PORT:-22}"
          SERVER_USER="${SERVER_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/study-plan}"
          SSH="ssh -i ~/.ssh/deploy_key -p $SERVER_PORT -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes"
          $SSH "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && COMPOSE_PROGRESS=plain BUILDKIT_PROGRESS=plain docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans && (docker network connect study-plan_default nginx-server 2>/dev/null || true) && docker exec nginx-server nginx -t && docker exec nginx-server nginx -s reload"
